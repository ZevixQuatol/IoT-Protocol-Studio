<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" fill="none">
  <g stroke="#53B559" stroke-width="18" stroke-linecap="round" stroke-linejoin="round">
    <!-- Outer rounded-square chip body -->
    <rect x="92" y="92" width="328" height="328" rx="64"/>

    <!-- Inner rounded-square line, same stroke thickness -->
    <rect x="122" y="122" width="268" height="268" rx="48"/>

    <!-- Top pins: 4 evenly spaced -->
    <line x1="154" y1="92" x2="154" y2="46"/>
    <line x1="222" y1="92" x2="222" y2="46"/>
    <line x1="290" y1="92" x2="290" y2="46"/>
    <line x1="358" y1="92" x2="358" y2="46"/>

    <!-- Bottom pins: 4 evenly spaced -->
    <line x1="154" y1="420" x2="154" y2="466"/>
    <line x1="222" y1="420" x2="222" y2="466"/>
    <line x1="290" y1="420" x2="290" y2="466"/>
    <line x1="358" y1="420" x2="358" y2="466"/>

    <!-- Left pins: 4 evenly spaced -->
    <line x1="92" y1="154" x2="46" y2="154"/>
    <line x1="92" y1="222" x2="46" y2="222"/>
    <line x1="92" y1="290" x2="46" y2="290"/>
    <line x1="92" y1="358" x2="46" y2="358"/>

    <!-- Right pins: 4 evenly spaced -->
    <line x1="420" y1="154" x2="466" y2="154"/>
    <line x1="420" y1="222" x2="466" y2="222"/>
    <line x1="420" y1="290" x2="466" y2="290"/>
    <line x1="420" y1="358" x2="466" y2="358"/>
  </g>
</svg>
